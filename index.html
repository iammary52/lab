<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gotham Grid Clock</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --panel-bg: rgba(10, 14, 22, 0.74);
      --panel-line: rgba(161, 182, 221, 0.26);
      --text-muted: rgba(182, 198, 226, 0.74);
      --text-strong: rgba(224, 234, 252, 0.95);
      --accent: #90aacd;
    }

    body {
      background: radial-gradient(circle at 52% 34%, #182131 0%, #0b111c 56%, #060910 100%);
      overflow: hidden;
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-strong);
    }

    canvas { display: block; }

    .hud {
      position: fixed;
      top: 22px;
      left: 22px;
      z-index: 10;
      width: min(300px, calc(100vw - 44px));
      border: 1px solid var(--panel-line);
      border-radius: 14px;
      background: var(--panel-bg);
      box-shadow: 0 18px 52px rgba(0, 0, 0, 0.55), inset 0 0 40px rgba(135, 160, 198, 0.08);
      backdrop-filter: blur(7px);
      padding: 16px 14px;
    }

    .hud__title {
      font-family: "Orbitron", "Bank Gothic", "Eurostile", "Rajdhani", sans-serif;
      font-size: 13px;
      letter-spacing: 0.26em;
      color: rgba(198, 214, 240, 0.92);
      margin-bottom: 4px;
    }

    .hud__subtitle {
      font-size: 10px;
      letter-spacing: 0.16em;
      color: rgba(152, 169, 198, 0.78);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .menu {
      display: grid;
      gap: 8px;
    }

    .menu button {
      border: 1px solid rgba(148, 171, 209, 0.24);
      border-radius: 8px;
      padding: 10px 12px;
      background: rgba(15, 21, 33, 0.72);
      color: var(--text-muted);
      font-family: "Orbitron", "Bank Gothic", "Eurostile", "Rajdhani", sans-serif;
      letter-spacing: 0.14em;
      text-align: left;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 160ms ease;
    }

    .menu button:hover {
      color: var(--text-strong);
      border-color: rgba(167, 191, 231, 0.5);
      background: rgba(22, 30, 45, 0.82);
      transform: translateX(2px);
    }

    .menu button.is-active {
      color: #eef5ff;
      border-color: rgba(195, 215, 247, 0.7);
      background: linear-gradient(95deg, rgba(75, 97, 128, 0.44), rgba(30, 42, 62, 0.9));
      box-shadow: inset 0 0 18px rgba(174, 198, 233, 0.16);
    }
  </style>
</head>
<body>
  <aside class="hud">
    <div class="hud__title">WAYNE TERMINAL</div>
    <div class="hud__subtitle">district interface</div>
    <nav class="menu" id="menu"></nav>
  </aside>
  <canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const menu = document.getElementById('menu');

const MENU_ITEMS = [
  { id: 'clock', label: 'Clock Grid', description: 'Live city chrono matrix' },
  { id: 'cases', label: 'Caseboard', description: 'Reserved module slot' },
  { id: 'transit', label: 'Transit', description: 'Reserved module slot' }
];

let activeView = 'cases';

function setView(viewId) {
  activeView = viewId;
  renderMenu();
}

function renderMenu() {
  menu.innerHTML = '';
  for (const item of MENU_ITEMS) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = item.label;
    btn.title = item.description;
    if (item.id === activeView) btn.classList.add('is-active');
    btn.addEventListener('click', () => setView(item.id));
    menu.appendChild(btn);
  }
}

let W = 0, H = 0;
const DEPTH = 8;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  buildClock();
  buildVignette();
}

function rand(n = 1) { return Math.random() * n; }

class Voxel {
  constructor(tone) {
    this.tone = tone;
    this.x = W * 0.5 + (Math.random() - 0.5) * W * 0.2;
    this.y = H * 0.5 + (Math.random() - 0.5) * H * 0.2;
    this.z = rand(DEPTH);
    this.tx = this.x;
    this.ty = this.y;
    this.tz = this.z;
    this.vx = 0;
    this.vy = 0;
    this.vz = 0;
  }

  burst() {
    this.vx += (Math.random() - 0.5) * 14;
    this.vy += (Math.random() - 0.5) * 14;
    this.vz += (Math.random() - 0.5) * 4;
  }

  setTarget(x, y, z) {
    this.tx = x;
    this.ty = y;
    this.tz = z;
  }

  update() {
    this.vx = this.vx * 0.73 + (this.tx - this.x) * 0.22;
    this.vy = this.vy * 0.73 + (this.ty - this.y) * 0.22;
    this.vz = this.vz * 0.72 + (this.tz - this.z) * 0.18;
    this.x += this.vx;
    this.y += this.vy;
    this.z += this.vz;
  }

  draw(cell, pulse) {
    const z = this.z;
    const lift = z * 0.9;
    const px = this.x + z * 0.85;
    const py = this.y - lift;
    const size = cell * 0.72;

    const light = 58 + z * 2.2 + pulse * 4.4;
    const sat = 16 + this.tone * 9;

    ctx.globalAlpha = 0.56;
    ctx.fillStyle = `hsl(212, ${sat}%, ${Math.min(82, light + 12)}%)`;
    ctx.beginPath();
    ctx.moveTo(px, py - size * 0.5);
    ctx.lineTo(px + size * 0.44, py - size * 0.26);
    ctx.lineTo(px, py);
    ctx.lineTo(px - size * 0.44, py - size * 0.26);
    ctx.closePath();
    ctx.fill();

    ctx.globalAlpha = 0.82;
    ctx.fillStyle = `hsl(214, ${sat}%, ${Math.min(74, light)}%)`;
    ctx.beginPath();
    ctx.moveTo(px - size * 0.44, py - size * 0.26);
    ctx.lineTo(px, py);
    ctx.lineTo(px, py + size * 0.52);
    ctx.lineTo(px - size * 0.44, py + size * 0.26);
    ctx.closePath();
    ctx.fill();

    ctx.globalAlpha = 0.77;
    ctx.fillStyle = `hsl(221, ${sat}%, ${Math.max(24, light - 18)}%)`;
    ctx.beginPath();
    ctx.moveTo(px + size * 0.44, py - size * 0.26);
    ctx.lineTo(px, py);
    ctx.lineTo(px, py + size * 0.52);
    ctx.lineTo(px + size * 0.44, py + size * 0.26);
    ctx.closePath();
    ctx.fill();
  }
}

const FONT_STACK = "'Arial Black','Inter',sans-serif";

class Slot {
  constructor(cx, cy, size, capacity, isColon = false) {
    this.cx = cx;
    this.cy = cy;
    this.fontSize = size;
    this.capacity = capacity;
    this.isColon = isColon;
    this.current = null;
    this.voxels = Array.from({ length: capacity }, (_, i) => new Voxel((i % 4) / 4));
    this.cell = Math.max(6, Math.floor(size / 11));
  }

  sampleChar(ch) {
    const fs = this.fontSize;
    const cw = Math.ceil(fs * (this.isColon ? 0.48 : 0.84)) + 36;
    const chh = Math.ceil(fs * 1.36) + 36;
    const off = document.createElement('canvas');
    off.width = cw;
    off.height = chh;
    const octx = off.getContext('2d');
    octx.fillStyle = '#fff';
    octx.font = `900 ${fs}px ${FONT_STACK}`;
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.fillText(ch, cw / 2, chh / 2);

    const data = octx.getImageData(0, 0, cw, chh).data;
    const pts = [];
    const step = this.cell;

    for (let y = 0; y < chh; y += step) {
      for (let x = 0; x < cw; x += step) {
        const a = data[(y * cw + x) * 4 + 3];
        if (a > 120) {
          pts.push({
            x: this.cx + x - cw / 2,
            y: this.cy + y - chh / 2,
            z: Math.floor(((y / chh) * DEPTH + rand(1.2)))
          });
        }
      }
    }
    return pts;
  }

  setChar(ch) {
    if (ch === this.current) return;
    this.current = ch;
    const points = this.sampleChar(ch);
    if (!points.length) return;

    for (const voxel of this.voxels) voxel.burst();
    for (let i = 0; i < this.voxels.length; i++) {
      const p = points[i % points.length];
      this.voxels[i].setTarget(p.x, p.y, p.z);
    }
  }

  update() { for (const voxel of this.voxels) voxel.update(); }

  draw(pulse) {
    const sorted = this.voxels.slice().sort((a, b) => a.z - b.z);
    for (const voxel of sorted) voxel.draw(this.cell, pulse);
  }
}

let gridShift = 0;
function drawGrid() {
  const major = Math.max(38, Math.floor(Math.min(W, H) / 18));
  const minor = Math.floor(major / 2);

  ctx.globalAlpha = 0.24;
  ctx.strokeStyle = 'rgba(125, 148, 188, 0.18)';
  ctx.lineWidth = 1;
  for (let x = (gridShift % major) - major; x < W + major; x += major) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = (gridShift * 0.58 % major) - major; y < H + major; y += major) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  ctx.globalAlpha = 0.09;
  ctx.strokeStyle = 'rgba(165, 186, 220, 0.16)';
  for (let x = (gridShift % minor) - minor; x < W + minor; x += minor) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = (gridShift * 0.48 % minor) - minor; y < H + minor; y += minor) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
}

let vignette;
function buildVignette() {
  vignette = ctx.createRadialGradient(W / 2, H / 2, H * 0.13, W / 2, H / 2, H * 0.82);
  vignette.addColorStop(0, 'rgba(8,11,19,0.02)');
  vignette.addColorStop(1, 'rgba(4,5,9,0.9)');
}

function drawVignette() {
  ctx.globalAlpha = 1;
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);
}

const WDAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
let dateStr = '';

function drawLabels() {
  if (!slots.length) return;
  const fs = slots[0].fontSize;
  ctx.textAlign = 'center';

  ctx.globalAlpha = 0.8;
  ctx.fillStyle = 'rgba(206,219,241,0.9)';
  ctx.font = `600 ${Math.max(12, fs * 0.1)}px Inter, 'Segoe UI', sans-serif`;
  ctx.fillText(dateStr, W / 2, H / 2 + fs * 0.77);

  ctx.globalAlpha = 0.34;
  ctx.fillStyle = 'rgba(158,176,208,0.9)';
  ctx.font = `500 ${Math.max(10, fs * 0.072)}px "Orbitron", "Eurostile", sans-serif`;
  ctx.fillText('GOTHAM GRID CLOCK', W / 2, H / 2 - fs * 0.87);
}

function drawModulePlaceholder() {
  const midX = W * 0.52;
  const midY = H * 0.53;
  ctx.textAlign = 'center';

  ctx.globalAlpha = 0.86;
  ctx.fillStyle = 'rgba(198,214,242,0.9)';
  ctx.font = `700 ${Math.max(24, Math.min(W, H) * 0.052)}px "Orbitron", "Eurostile", sans-serif`;
  ctx.fillText('SYSTEM MODULE LOCKED', midX, midY - 20);

  ctx.globalAlpha = 0.56;
  ctx.fillStyle = 'rgba(158,177,214,0.84)';
  ctx.font = `500 ${Math.max(12, Math.min(W, H) * 0.018)}px Inter, sans-serif`;
  ctx.fillText('Select CLOCK GRID from upper-left panel to activate chrono display.', midX, midY + 24);

  ctx.globalAlpha = 0.4;
  ctx.strokeStyle = 'rgba(148, 171, 212, 0.5)';
  ctx.lineWidth = 1.2;
  const bw = Math.min(760, W * 0.62);
  const bh = Math.max(90, H * 0.18);
  ctx.strokeRect(midX - bw / 2, midY - bh / 2, bw, bh);
}

let slots = [];
let lastSec = -1;
let pulse = 0;

function buildClock() {
  const fs = Math.min(H * 0.29, W / 8.2);
  const charW = fs * 0.7;
  const colonW = fs * 0.36;
  const gap = fs * 0.07;
  const total = charW * 6 + colonW * 2 + gap * 7;
  let x = (W - total) / 2;
  const cy = H / 2;

  const layout = [
    { w: charW, cap: 210, colon: false },
    { w: charW, cap: 210, colon: false },
    { w: colonW, cap: 56, colon: true },
    { w: charW, cap: 210, colon: false },
    { w: charW, cap: 210, colon: false },
    { w: colonW, cap: 56, colon: true },
    { w: charW, cap: 210, colon: false },
    { w: charW, cap: 210, colon: false }
  ];

  slots = layout.map(item => {
    const s = new Slot(x + item.w / 2, cy, fs, item.cap, item.colon);
    x += item.w + gap;
    return s;
  });

  lastSec = -1;
}

function tickClock() {
  const now = new Date();
  const sec = now.getSeconds();
  if (sec === lastSec) return;

  pulse = 1;
  lastSec = sec;

  const pad = n => String(n).padStart(2, '0');
  const hh = pad(now.getHours());
  const mm = pad(now.getMinutes());
  const ss = pad(sec);
  const chars = [hh[0], hh[1], ':', mm[0], mm[1], ':', ss[0], ss[1]];
  for (let i = 0; i < slots.length; i++) slots[i].setChar(chars[i]);
  dateStr = `${WDAYS[now.getDay()]} · ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
}

function drawClockView() {
  tickClock();
  for (const slot of slots) {
    slot.update();
    slot.draw(pulse);
  }
  drawLabels();
}

function loop() {
  gridShift += 0.13;
  pulse = Math.max(0, pulse - 0.03);

  ctx.globalAlpha = 1;
  ctx.fillStyle = '#070b12';
  ctx.fillRect(0, 0, W, H);

  drawGrid();

  ctx.save();
  if (activeView === 'clock') drawClockView();
  else drawModulePlaceholder();
  ctx.restore();

  drawVignette();
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
renderMenu();
resize();
tickClock();
loop();
</script>
</body>
</html>
