<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>lab feed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;650;800&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet" />
    <style>
:root {
  color-scheme: light;
  --ink: #171717;
  --muted: #6a6a70;
  --paper: #fbfaf6;
  --line: rgba(23, 23, 23, 0.12);
  --acid: #caff34;
  --pink: #ff5aa5;
  --cyan: #48d6ff;
  --orange: #ff8b3d;
  --violet: #8a6dff;
  --shadow: 0 22px 64px rgba(23, 23, 23, 0.18);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  background:
    linear-gradient(115deg, rgba(202, 255, 52, 0.18), transparent 30%),
    linear-gradient(245deg, rgba(255, 90, 165, 0.16), transparent 34%),
    var(--paper);
  color: var(--ink);
  font-family: Inter, "Noto Sans KR", system-ui, sans-serif;
}

button,
textarea {
  font: inherit;
}

.shell {
  width: min(100%, 520px);
  min-height: 100vh;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top) + 18px) 16px 28px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 18px;
}

.eyebrow {
  margin: 0 0 2px;
  font-size: 11px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: 0;
  text-transform: uppercase;
  color: var(--pink);
}

h1 {
  margin: 0;
  font-size: 38px;
  line-height: 0.94;
  letter-spacing: 0;
  font-weight: 900;
}

.icon-button {
  width: 50px;
  height: 50px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--ink);
  color: var(--acid);
  box-shadow: 0 12px 26px rgba(23, 23, 23, 0.2);
}

.icon-button span {
  display: block;
  font-size: 25px;
  transform: translateY(-1px);
}

.composer {
  display: grid;
  grid-template-columns: 108px minmax(0, 1fr);
  gap: 12px;
  min-height: 142px;
  margin-bottom: 18px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 24px;
  background: rgba(255, 255, 255, 0.66);
  box-shadow: 0 14px 44px rgba(23, 23, 23, 0.09);
  backdrop-filter: blur(18px);
}

.dropzone {
  position: relative;
  display: grid;
  place-items: center;
  min-height: 122px;
  overflow: hidden;
  border-radius: 18px;
  background:
    linear-gradient(135deg, var(--acid), var(--cyan) 52%, var(--pink));
  color: var(--ink);
  font-size: 13px;
  font-weight: 900;
  text-transform: uppercase;
}

.dropzone input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.dropzone img {
  position: absolute;
  inset: 0;
  display: none;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.dropzone.has-image img {
  display: block;
}

.dropzone.has-image span {
  opacity: 0;
}

.composer-copy {
  display: grid;
  grid-template-rows: 1fr auto;
  min-width: 0;
}

textarea {
  width: 100%;
  min-height: 82px;
  padding: 10px 8px;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--ink);
  font-size: 18px;
  font-weight: 800;
  line-height: 1.25;
}

textarea::placeholder {
  color: rgba(23, 23, 23, 0.36);
}

.composer-actions {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
}

#statusText {
  min-height: 18px;
  margin: 0;
  overflow: hidden;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#saveButton {
  min-width: 76px;
  height: 38px;
  border: 0;
  border-radius: 999px;
  background: var(--ink);
  color: #fff;
  font-weight: 900;
  box-shadow: 0 10px 24px rgba(23, 23, 23, 0.18);
}

#saveButton:disabled {
  opacity: 0.48;
}

.stage {
  position: relative;
  min-height: calc(100vh - 238px);
  padding-bottom: 70px;
}

.post-card {
  position: relative;
  touch-action: none;
  user-select: none;
  width: min(82vw, 390px);
  margin: 0 0 16px;
  border: 1px solid var(--line);
  border-radius: 28px;
  background: #fff;
  box-shadow: var(--shadow);
  transform: translate3d(var(--tx, 0px), var(--ty, 0px), 0) rotate(var(--rot, 0deg));
  transition: transform 420ms cubic-bezier(0.18, 1.2, 0.22, 1), box-shadow 220ms ease, filter 220ms ease;
  will-change: transform;
}

.post-card:nth-child(2n) {
  margin-left: auto;
}

.post-card:nth-child(3n) {
  margin-left: 8%;
}

.post-card.is-dragging {
  z-index: 20;
  filter: saturate(1.14);
  box-shadow: 0 30px 78px rgba(23, 23, 23, 0.28);
  transition: box-shadow 180ms ease, filter 180ms ease;
}

.post-card.is-new {
  animation: pop-in 620ms cubic-bezier(0.18, 1.2, 0.22, 1) both;
}

.media-wrap {
  aspect-ratio: 4 / 5;
  margin: 8px;
  overflow: hidden;
  border-radius: 22px;
  background:
    linear-gradient(135deg, rgba(72, 214, 255, 0.36), rgba(255, 139, 61, 0.26)),
    #ece9e0;
}

.post-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.post-meta {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 10px;
  padding: 4px 16px 16px;
}

.post-message {
  margin: 0;
  min-width: 0;
  font-size: 20px;
  font-weight: 900;
  line-height: 1.18;
  overflow-wrap: anywhere;
}

.post-date {
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
}

.empty {
  display: grid;
  place-items: center;
  min-height: 260px;
  color: rgba(23, 23, 23, 0.44);
  font-size: 15px;
  font-weight: 900;
}

@keyframes pop-in {
  from {
    opacity: 0;
    transform: translate3d(0, 24px, 0) scale(0.94) rotate(-2deg);
  }
  to {
    opacity: 1;
    transform: translate3d(var(--tx, 0px), var(--ty, 0px), 0) scale(1) rotate(var(--rot, 0deg));
  }
}

@media (min-width: 700px) {
  .shell {
    padding-top: 30px;
  }

  .stage {
    min-height: 680px;
  }
}

    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">blank</p>
          <h1>lab feed</h1>
        </div>
        <button class="icon-button" id="shuffleButton" type="button" aria-label="피드 섞기">
          <span aria-hidden="true">✦</span>
        </button>
      </header>

      <section class="composer" aria-label="새 포스트">
        <label class="dropzone" for="photoInput">
          <input id="photoInput" type="file" accept="image/*" />
          <img id="previewImage" alt="" />
          <span id="dropText">photo</span>
        </label>
        <div class="composer-copy">
          <textarea id="messageInput" maxlength="140" placeholder="오늘의 조각"></textarea>
          <div class="composer-actions">
            <p id="statusText" role="status"></p>
            <button id="saveButton" type="button">post</button>
          </div>
        </div>
      </section>

      <section class="stage" id="stage" aria-label="피드"></section>
    </main>

    <template id="postTemplate">
      <article class="post-card">
        <div class="media-wrap">
          <img class="post-image" alt="" draggable="false" />
        </div>
        <div class="post-meta">
          <p class="post-message"></p>
          <time class="post-date"></time>
        </div>
      </article>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
const SUPABASE_URL = "https://gftydfeqpuavajjzaeun.supabase.co";
const SUPABASE_KEY = "sb_publishable_35lefXRrUU4MFrAATfghjQ_2EPkUgGy";
const IMAGE_BUCKET = "post-images";
const LAYOUT_KEY = "lab-feed-layout-v1";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const stage = document.querySelector("#stage");
const template = document.querySelector("#postTemplate");
const photoInput = document.querySelector("#photoInput");
const previewImage = document.querySelector("#previewImage");
const dropzone = document.querySelector(".dropzone");
const messageInput = document.querySelector("#messageInput");
const saveButton = document.querySelector("#saveButton");
const statusText = document.querySelector("#statusText");
const shuffleButton = document.querySelector("#shuffleButton");

let selectedFile = null;
let posts = [];
let layout = readLayout();

function readLayout() {
  try {
    return JSON.parse(localStorage.getItem(LAYOUT_KEY) || "{}");
  } catch {
    return {};
  }
}

function writeLayout() {
  localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout));
}

function setStatus(text) {
  statusText.textContent = text;
}

function publicImageUrl(path) {
  if (!path) return "";
  return client.storage.from(IMAGE_BUCKET).getPublicUrl(path).data.publicUrl;
}

function formatDate(value) {
  return new Intl.DateTimeFormat("ko", { month: "short", day: "numeric" }).format(new Date(value));
}

function fallbackGradient(seed) {
  const hues = [78, 196, 330, 24, 252];
  const a = hues[seed % hues.length];
  const b = hues[(seed + 2) % hues.length];
  return `linear-gradient(135deg, hsl(${a} 92% 67%), hsl(${b} 92% 66%))`;
}

function renderPosts({ freshId } = {}) {
  stage.innerHTML = "";

  if (!posts.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "아직 조용함";
    stage.appendChild(empty);
    return;
  }

  posts.forEach((post, index) => {
    const node = template.content.firstElementChild.cloneNode(true);
    const img = node.querySelector(".post-image");
    const media = node.querySelector(".media-wrap");
    const message = node.querySelector(".post-message");
    const date = node.querySelector(".post-date");
    const saved = layout[post.id] || {};

    node.dataset.id = post.id;
    node.style.setProperty("--tx", `${saved.x || 0}px`);
    node.style.setProperty("--ty", `${saved.y || 0}px`);
    node.style.setProperty("--rot", `${saved.rot ?? rotationFor(index)}deg`);
    if (post.id === freshId) node.classList.add("is-new");

    message.textContent = post.message || "untitled";
    date.textContent = post.created_at ? formatDate(post.created_at) : "now";

    const src = publicImageUrl(post.image_path);
    if (src) {
      img.src = src;
      img.alt = post.message || "post image";
    } else {
      img.remove();
      media.style.background = fallbackGradient(index);
    }

    attachDrag(node);
    stage.appendChild(node);
  });
}

function rotationFor(index) {
  return [-1.4, 1.8, -2.2, 1.1, -0.7][index % 5];
}

async function loadPosts() {
  setStatus("sync");
  const { data, error } = await client
    .from("posts")
    .select("id,message,image_path,created_at")
    .order("created_at", { ascending: false })
    .limit(20);

  if (error) {
    setStatus(error.message);
    posts = demoPosts();
  } else {
    posts = data || [];
    setStatus("");
  }

  renderPosts();
}

function demoPosts() {
  return [
    { id: "demo-a", message: "soft launch", created_at: new Date().toISOString(), image_path: "" },
    { id: "demo-b", message: "move me", created_at: new Date().toISOString(), image_path: "" },
  ];
}

photoInput.addEventListener("change", () => {
  selectedFile = photoInput.files?.[0] || null;
  if (!selectedFile) return;

  previewImage.src = URL.createObjectURL(selectedFile);
  dropzone.classList.add("has-image");
});

saveButton.addEventListener("click", async () => {
  const message = messageInput.value.trim();
  if (!message && !selectedFile) {
    setStatus("비어 있음");
    return;
  }

  saveButton.disabled = true;
  setStatus("posting");

  try {
    const imagePath = selectedFile ? await uploadImage(selectedFile) : "";
    const { data, error } = await client
      .from("posts")
      .insert({ message: message || "photo drop", image_path: imagePath })
      .select("id,message,image_path,created_at")
      .single();

    if (error) throw error;

    posts = [data, ...posts];
    messageInput.value = "";
    photoInput.value = "";
    selectedFile = null;
    previewImage.removeAttribute("src");
    dropzone.classList.remove("has-image");
    setStatus("saved");
    renderPosts({ freshId: data.id });
    window.setTimeout(() => setStatus(""), 1200);
  } catch (error) {
    setStatus(error.message || "save failed");
  } finally {
    saveButton.disabled = false;
  }
});

async function uploadImage(file) {
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
  const day = new Date().toISOString().slice(0, 10);
  const path = `${day}/${crypto.randomUUID()}.${ext}`;
  const { error } = await client.storage.from(IMAGE_BUCKET).upload(path, file, {
    cacheControl: "3600",
    contentType: file.type || "image/jpeg",
    upsert: false,
  });

  if (error) throw error;
  return path;
}

function attachDrag(card) {
  let startX = 0;
  let startY = 0;
  let baseX = 0;
  let baseY = 0;
  let isDragging = false;

  card.addEventListener("pointerdown", (event) => {
    card.setPointerCapture(event.pointerId);
    const saved = layout[card.dataset.id] || {};
    startX = event.clientX;
    startY = event.clientY;
    baseX = saved.x || 0;
    baseY = saved.y || 0;
    isDragging = true;
    card.classList.add("is-dragging");
  });

  card.addEventListener("pointermove", (event) => {
    if (!isDragging) return;
    const x = baseX + event.clientX - startX;
    const y = baseY + event.clientY - startY;
    const rot = Math.max(-7, Math.min(7, x / 24));
    card.style.setProperty("--tx", `${x}px`);
    card.style.setProperty("--ty", `${y}px`);
    card.style.setProperty("--rot", `${rot}deg`);
  });

  card.addEventListener("pointerup", (event) => finishDrag(card, event.pointerId));
  card.addEventListener("pointercancel", (event) => finishDrag(card, event.pointerId));
}

function finishDrag(card, pointerId) {
  const matrix = new DOMMatrixReadOnly(getComputedStyle(card).transform);
  const x = Math.round(matrix.m41);
  const y = Math.round(matrix.m42);
  const rot = Number.parseFloat(getComputedStyle(card).getPropertyValue("--rot")) || 0;

  card.releasePointerCapture(pointerId);
  card.classList.remove("is-dragging");
  layout[card.dataset.id] = { x, y, rot };
  writeLayout();
}

shuffleButton.addEventListener("click", () => {
  const cards = [...stage.querySelectorAll(".post-card")];
  cards.forEach((card, index) => {
    const x = Math.round((Math.random() - 0.5) * 54);
    const y = Math.round((Math.random() - 0.5) * 42);
    const rot = rotationFor(index) + (Math.random() - 0.5) * 4;
    layout[card.dataset.id] = { x, y, rot };
    card.style.setProperty("--tx", `${x}px`);
    card.style.setProperty("--ty", `${y}px`);
    card.style.setProperty("--rot", `${rot}deg`);
  });
  writeLayout();
});

loadPosts();

    </script>
  </body>
</html>
