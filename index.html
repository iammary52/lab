<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Particle Clock</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const TAU    = Math.PI * 2;

let W, H;
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();

function rand(n)  { return Math.random() * (n == null ? 1 : n); }
function randn()  { return Math.random() - 0.5; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = 0 | (Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// ─── PARTICLE ────────────────────────────────────────────────────────────────
class Particle {
  constructor(baseHue) {
    this.baseHue  = baseHue;
    this.x        = W * 0.5 + randn() * W * 0.4;
    this.y        = H * 0.5 + randn() * H * 0.4;
    this.vx       = 0;
    this.vy       = 0;
    this.tx       = this.x;
    this.ty       = this.y;
    this.phase    = rand(TAU);
    this.phaseSpd = 0.038 + rand(0.10);
    this.size     = 1.2 + rand(1.9);
  }

  burst() {
    const a = rand(TAU);
    const s = 5 + rand(18);
    this.vx += Math.cos(a) * s;
    this.vy += Math.sin(a) * s;
  }

  setTarget(tx, ty) { this.tx = tx; this.ty = ty; }

  update() {
    const dx = this.tx - this.x;
    const dy = this.ty - this.y;
    this.vx   = this.vx * 0.80 + dx * 0.12;
    this.vy   = this.vy * 0.80 + dy * 0.12;
    this.x   += this.vx;
    this.y   += this.vy;
    this.phase += this.phaseSpd;
  }

  draw(hueShift, pulseBoost) {
    const b   = 0.5 + 0.5 * Math.sin(this.phase);
    const hue = (this.baseHue + hueShift) % 360;
    const lit = 42 + b * 55;
    const alp = 0.45 + b * 0.55;
    const r   = this.size * (0.6 + b * 0.7);
    ctx.globalAlpha = alp;
    ctx.fillStyle   = `hsl(${hue},100%,${lit}%)`;
    ctx.shadowColor = `hsl(${hue},100%,78%)`;
    ctx.shadowBlur  = 4 + b * 12 + pulseBoost * b;
    ctx.beginPath();
    ctx.arc(this.x, this.y, r, 0, TAU);
    ctx.fill();
  }
}

// ─── SLOT ────────────────────────────────────────────────────────────────────
const FONT_STACK = "'Arial Black','Impact',Arial,sans-serif";

class Slot {
  constructor(cx, cy, fontSize, baseHue, capacity) {
    this.cx        = cx;
    this.cy        = cy;
    this.fontSize  = fontSize;
    this.current   = null;
    this.particles = [];
    for (let i = 0; i < capacity; i++)
      this.particles.push(new Particle(baseHue + randn() * 28));
  }

  _sample(ch) {
    const fs  = this.fontSize;
    const cw  = Math.ceil(fs * 0.78) + 24;
    const cch = Math.ceil(fs * 1.32) + 24;
    const off = document.createElement('canvas');
    off.width = cw; off.height = cch;
    const oc  = off.getContext('2d');
    oc.font   = `900 ${fs}px ${FONT_STACK}`;
    oc.fillStyle = '#fff'; oc.textAlign = 'center'; oc.textBaseline = 'middle';
    oc.fillText(ch, cw / 2, cch / 2);
    const d    = oc.getImageData(0, 0, cw, cch).data;
    const step = Math.max(2, 0 | (fs / 42));
    const pts  = [];
    for (let y = 0; y < cch; y += step)
      for (let x = 0; x < cw; x += step)
        if (d[(y * cw + x) * 4 + 3] > 110)
          pts.push([this.cx + x - cw / 2, this.cy + y - cch / 2]);
    return pts;
  }

  setChar(ch) {
    if (ch === this.current) return;
    this.current = ch;
    const pts = shuffle(this._sample(ch));
    if (!pts.length) return;
    for (const p of this.particles) p.burst();
    for (let i = 0; i < this.particles.length; i++) {
      const pt = pts[i % pts.length];
      this.particles[i].setTarget(pt[0], pt[1]);
    }
  }

  update() { for (const p of this.particles) p.update(); }
  draw(hs, pb) { for (const p of this.particles) p.draw(hs, pb); }
}

// ─── STARS ───────────────────────────────────────────────────────────────────
const stars = Array.from({ length: 220 }, () => ({
  x: Math.random(), y: Math.random(),
  r: 0.3 + Math.random() * 1.4,
  ph: Math.random() * TAU, spd: 0.005 + Math.random() * 0.02
}));

function drawStars() {
  ctx.shadowBlur = 5;
  for (const s of stars) {
    s.ph += s.spd;
    ctx.globalAlpha = 0.06 + 0.22 * Math.sin(s.ph);
    ctx.fillStyle = '#b8d8ff'; ctx.shadowColor = '#6ab2ff';
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, TAU); ctx.fill();
  }
  ctx.shadowBlur = 0;
}

// ─── SCANLINES ───────────────────────────────────────────────────────────────
function drawScanlines() {
  ctx.globalAlpha = 0.025; ctx.fillStyle = '#000'; ctx.shadowBlur = 0;
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 1);
}

// ─── VIGNETTE ────────────────────────────────────────────────────────────────
let vig = null;
function buildVignette() {
  vig = ctx.createRadialGradient(W/2, H/2, H*0.1, W/2, H/2, H*0.88);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.92)');
}
function drawVignette() {
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);
}

// ─── LABELS ──────────────────────────────────────────────────────────────────
const WDAYS  = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

function drawLabels(dateStr, hs) {
  if (!slots.length) return;
  const fs0 = slots[0].fontSize;
  const hue = hs % 360, hue2 = (hs + 180) % 360;

  ctx.globalAlpha = 0.5; ctx.shadowBlur = 12;
  ctx.shadowColor = `hsl(${hue},70%,60%)`; ctx.fillStyle = `hsl(${hue},55%,80%)`;
  ctx.font = `300 ${Math.max(11, fs0 * 0.115)}px 'Courier New',monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText(dateStr, W / 2, H / 2 + fs0 * 0.74);

  ctx.globalAlpha = 0.22; ctx.shadowBlur = 8;
  ctx.shadowColor = `hsl(${hue2},60%,60%)`; ctx.fillStyle = `hsl(${hue2},45%,72%)`;
  ctx.font = `300 ${Math.max(9, fs0 * 0.09)}px 'Courier New',monospace`;
  ctx.fillText('P  A  R  T  I  C  L  E    C  L  O  C  K', W / 2, H / 2 - fs0 * 0.83);
}

// ─── CLOCK ───────────────────────────────────────────────────────────────────
let slots = [], lastSec = -1, dateStr = '', pulse = 0;

function buildClock() {
  const fs     = Math.min(H * 0.27, W / 8.5);
  const charW  = fs * 0.68, colonW = fs * 0.34, gap = fs * 0.07;
  const total  = 6 * charW + 2 * colonW + 7 * gap;
  let   curX   = (W - total) / 2;
  const cy     = H / 2;

  const layout = [
    { w: charW,  hue: 200, cap: 290 }, { w: charW,  hue: 225, cap: 290 },
    { w: colonW, hue: 250, cap: 60  }, { w: charW,  hue: 270, cap: 290 },
    { w: charW,  hue: 295, cap: 290 }, { w: colonW, hue: 325, cap: 60  },
    { w: charW,  hue: 345, cap: 290 }, { w: charW,  hue: 15,  cap: 290 },
  ];

  slots = layout.map(l => {
    const s = new Slot(curX + l.w / 2, cy, fs, l.hue, l.cap);
    curX += l.w + gap;
    return s;
  });
  lastSec = -1;
  buildVignette();
}

function tickClock() {
  const now = new Date(), sec = now.getSeconds();
  if (sec === lastSec) return;
  lastSec = sec; pulse = 1.0;
  const pad = n => String(n).padStart(2, '0');
  const hh = pad(now.getHours()), mm = pad(now.getMinutes()), ss = pad(sec);
  [hh[0], hh[1], ':', mm[0], mm[1], ':', ss[0], ss[1]].forEach((c, i) => slots[i].setChar(c));
  dateStr = `${WDAYS[now.getDay()]}  ·  ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
}

// ─── LOOP ────────────────────────────────────────────────────────────────────
let hueShift = 0;
buildClock(); tickClock();
window.addEventListener('resize', () => { resize(); buildClock(); tickClock(); });

function loop() {
  hueShift = (hueShift + 0.22) % 360;
  pulse    = Math.max(0, pulse - 0.035);

  ctx.globalAlpha = 0.80; ctx.shadowBlur = 0;
  ctx.fillStyle = '#00000d'; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1;

  drawStars();
  tickClock();

  ctx.save();
  const pb = pulse * 20;
  for (const s of slots) { s.update(); s.draw(hueShift, pb); }
  ctx.restore();
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  drawLabels(dateStr, hueShift);
  drawScanlines();
  drawVignette();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
