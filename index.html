<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid Clock</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(circle at 50% 40%, #101827 0%, #070b13 60%, #04060b 100%);
      overflow: hidden;
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0;
const DEPTH = 8;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  buildClock();
  buildVignette();
}

function rand(n = 1) { return Math.random() * n; }

class Voxel {
  constructor(tone) {
    this.tone = tone;
    this.x = W * 0.5 + (Math.random() - 0.5) * W * 0.2;
    this.y = H * 0.5 + (Math.random() - 0.5) * H * 0.2;
    this.z = rand(DEPTH);
    this.tx = this.x;
    this.ty = this.y;
    this.tz = this.z;
    this.vx = 0;
    this.vy = 0;
    this.vz = 0;
  }

  burst() {
    this.vx += (Math.random() - 0.5) * 16;
    this.vy += (Math.random() - 0.5) * 16;
    this.vz += (Math.random() - 0.5) * 5;
  }

  setTarget(x, y, z) {
    this.tx = x;
    this.ty = y;
    this.tz = z;
  }

  update() {
    this.vx = this.vx * 0.73 + (this.tx - this.x) * 0.22;
    this.vy = this.vy * 0.73 + (this.ty - this.y) * 0.22;
    this.vz = this.vz * 0.72 + (this.tz - this.z) * 0.19;
    this.x += this.vx;
    this.y += this.vy;
    this.z += this.vz;
  }

  draw(cell, pulse) {
    const z = this.z;
    const lift = z * 0.9;
    const px = this.x + z * 0.8;
    const py = this.y - lift;
    const size = cell * 0.72;

    const light = 66 + z * 2.6 + pulse * 5;
    const sat = 22 + this.tone * 10;

    ctx.globalAlpha = 0.6;
    ctx.fillStyle = `hsl(208, ${sat}%, ${Math.min(89, light + 11)}%)`;
    ctx.beginPath();
    ctx.moveTo(px, py - size * 0.5);
    ctx.lineTo(px + size * 0.44, py - size * 0.26);
    ctx.lineTo(px, py);
    ctx.lineTo(px - size * 0.44, py - size * 0.26);
    ctx.closePath();
    ctx.fill();

    ctx.globalAlpha = 0.83;
    ctx.fillStyle = `hsl(214, ${sat}%, ${Math.min(82, light)}%)`;
    ctx.beginPath();
    ctx.moveTo(px - size * 0.44, py - size * 0.26);
    ctx.lineTo(px, py);
    ctx.lineTo(px, py + size * 0.52);
    ctx.lineTo(px - size * 0.44, py + size * 0.26);
    ctx.closePath();
    ctx.fill();

    ctx.globalAlpha = 0.78;
    ctx.fillStyle = `hsl(220, ${sat}%, ${Math.max(28, light - 20)}%)`;
    ctx.beginPath();
    ctx.moveTo(px + size * 0.44, py - size * 0.26);
    ctx.lineTo(px, py);
    ctx.lineTo(px, py + size * 0.52);
    ctx.lineTo(px + size * 0.44, py + size * 0.26);
    ctx.closePath();
    ctx.fill();

    ctx.globalAlpha = 0.22 + z * 0.02;
    ctx.fillStyle = 'rgba(149,180,255,0.42)';
    ctx.fillRect(px - size * 0.08, py + size * 0.52, size * 0.16, size * 0.12 + z * 0.1);
  }
}

const FONT_STACK = "'Arial Black','Inter',sans-serif";

class Slot {
  constructor(cx, cy, size, capacity, isColon = false) {
    this.cx = cx;
    this.cy = cy;
    this.fontSize = size;
    this.capacity = capacity;
    this.isColon = isColon;
    this.current = null;
    this.voxels = Array.from({ length: capacity }, (_, i) => new Voxel((i % 4) / 4));
    this.cell = Math.max(6, Math.floor(size / 11));
  }

  sampleChar(ch) {
    const fs = this.fontSize;
    const cw = Math.ceil(fs * (this.isColon ? 0.48 : 0.84)) + 36;
    const chh = Math.ceil(fs * 1.36) + 36;
    const off = document.createElement('canvas');
    off.width = cw;
    off.height = chh;
    const octx = off.getContext('2d');
    octx.fillStyle = '#fff';
    octx.font = `900 ${fs}px ${FONT_STACK}`;
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.fillText(ch, cw / 2, chh / 2);

    const data = octx.getImageData(0, 0, cw, chh).data;
    const pts = [];
    const step = this.cell;

    for (let y = 0; y < chh; y += step) {
      for (let x = 0; x < cw; x += step) {
        const a = data[(y * cw + x) * 4 + 3];
        if (a > 120) {
          pts.push({
            x: this.cx + x - cw / 2,
            y: this.cy + y - chh / 2,
            z: Math.floor(((y / chh) * DEPTH + rand(1.2)))
          });
        }
      }
    }
    return pts;
  }

  setChar(ch) {
    if (ch === this.current) return;
    this.current = ch;
    const points = this.sampleChar(ch);
    if (!points.length) return;

    for (const voxel of this.voxels) voxel.burst();

    for (let i = 0; i < this.voxels.length; i++) {
      const p = points[i % points.length];
      this.voxels[i].setTarget(p.x, p.y, p.z);
    }
  }

  update() {
    for (const voxel of this.voxels) voxel.update();
  }

  draw(pulse) {
    const sorted = this.voxels.slice().sort((a, b) => a.z - b.z);
    for (const voxel of sorted) voxel.draw(this.cell, pulse);
  }
}

let gridShift = 0;
function drawGrid() {
  const major = Math.max(38, Math.floor(Math.min(W, H) / 18));
  const minor = Math.floor(major / 2);

  ctx.globalAlpha = 0.26;
  ctx.strokeStyle = 'rgba(124, 155, 205, 0.16)';
  ctx.lineWidth = 1;
  for (let x = (gridShift % major) - major; x < W + major; x += major) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = (gridShift * 0.6 % major) - major; y < H + major; y += major) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  ctx.globalAlpha = 0.1;
  ctx.strokeStyle = 'rgba(151, 181, 224, 0.16)';
  for (let x = (gridShift % minor) - minor; x < W + minor; x += minor) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = (gridShift * 0.5 % minor) - minor; y < H + minor; y += minor) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
}

let vignette;
function buildVignette() {
  vignette = ctx.createRadialGradient(W / 2, H / 2, H * 0.12, W / 2, H / 2, H * 0.82);
  vignette.addColorStop(0, 'rgba(7,10,18,0)');
  vignette.addColorStop(1, 'rgba(5,7,12,0.88)');
}

function drawVignette() {
  ctx.globalAlpha = 1;
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);
}

const WDAYS = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
let dateStr = '';

function drawLabels() {
  if (!slots.length) return;
  const fs = slots[0].fontSize;
  ctx.textAlign = 'center';

  ctx.globalAlpha = 0.85;
  ctx.fillStyle = 'rgba(214,226,245,0.88)';
  ctx.font = `600 ${Math.max(12, fs * 0.1)}px Inter, 'Segoe UI', sans-serif`;
  ctx.fillText(dateStr, W / 2, H / 2 + fs * 0.77);

  ctx.globalAlpha = 0.4;
  ctx.fillStyle = 'rgba(164,180,207,0.9)';
  ctx.font = `500 ${Math.max(10, fs * 0.072)}px Inter, 'Segoe UI', sans-serif`;
  ctx.fillText('GRID CLOCK', W / 2, H / 2 - fs * 0.87);
}

let slots = [];
let lastSec = -1;
let pulse = 0;

function buildClock() {
  const fs = Math.min(H * 0.29, W / 8.2);
  const charW = fs * 0.7;
  const colonW = fs * 0.36;
  const gap = fs * 0.07;
  const total = charW * 6 + colonW * 2 + gap * 7;
  let x = (W - total) / 2;
  const cy = H / 2;

  const layout = [
    { w: charW, cap: 210, colon: false },
    { w: charW, cap: 210, colon: false },
    { w: colonW, cap: 56, colon: true },
    { w: charW, cap: 210, colon: false },
    { w: charW, cap: 210, colon: false },
    { w: colonW, cap: 56, colon: true },
    { w: charW, cap: 210, colon: false },
    { w: charW, cap: 210, colon: false }
  ];

  slots = layout.map(item => {
    const s = new Slot(x + item.w / 2, cy, fs, item.cap, item.colon);
    x += item.w + gap;
    return s;
  });

  lastSec = -1;
}

function tickClock() {
  const now = new Date();
  const sec = now.getSeconds();
  if (sec === lastSec) return;

  pulse = 1;
  lastSec = sec;

  const pad = n => String(n).padStart(2, '0');
  const hh = pad(now.getHours());
  const mm = pad(now.getMinutes());
  const ss = pad(sec);
  const chars = [hh[0], hh[1], ':', mm[0], mm[1], ':', ss[0], ss[1]];
  for (let i = 0; i < slots.length; i++) slots[i].setChar(chars[i]);

  dateStr = `${WDAYS[now.getDay()]} · ${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
}

function loop() {
  gridShift += 0.13;
  pulse = Math.max(0, pulse - 0.03);

  ctx.globalAlpha = 1;
  ctx.fillStyle = '#060a12';
  ctx.fillRect(0, 0, W, H);

  drawGrid();
  tickClock();

  ctx.save();
  for (const slot of slots) {
    slot.update();
    slot.draw(pulse);
  }
  ctx.restore();

  drawLabels();
  drawVignette();

  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
resize();
tickClock();
loop();
</script>
</body>
</html>
