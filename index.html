<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>lab feed</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@500;650;800;900&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">public drop</p>
          <h1>lab feed</h1>
        </div>
        <button class="round-button" id="refreshButton" type="button" aria-label="새로고침">sync</button>
      </header>

      <section class="composer" aria-label="새 포스트">
        <label class="dropzone" for="photoInput">
          <input id="photoInput" type="file" accept="image/*" />
          <img id="previewImage" alt="" />
          <span>tap<br />photo</span>
        </label>
        <div class="composer-copy">
          <textarea id="messageInput" maxlength="140" placeholder="caption, hot take, tiny diary"></textarea>
          <div class="composer-actions">
            <p id="statusText" role="status"></p>
            <button id="saveButton" type="button">post</button>
          </div>
        </div>
      </section>

      <section class="controls" aria-label="피드 컨트롤">
        <label class="search-box">
          <span>find</span>
          <input id="searchInput" type="search" placeholder="caption search" />
        </label>
        <div class="segmented" aria-label="정렬">
          <button class="sort-chip is-active" type="button" data-sort="new">new</button>
          <button class="sort-chip" type="button" data-sort="hot">hot</button>
        </div>
      </section>

      <section class="ticker" aria-label="상태">
        <span>heart once/session</span>
        <span>comments live</span>
        <span>edit/delete open</span>
      </section>

      <section class="stage" id="stage" aria-label="피드"></section>
    </main>

    <template id="postTemplate">
      <article class="post-card">
        <div class="card-actions">
          <button class="mini-button edit-post" type="button">edit</button>
          <button class="mini-button delete-post" type="button">del</button>
        </div>
        <div class="media-wrap">
          <img class="post-image" alt="" draggable="false" />
        </div>
        <div class="post-meta">
          <p class="post-message"></p>
          <time class="post-date"></time>
        </div>
        <div class="reaction-row">
          <button class="heart-button" type="button" aria-label="좋아요">♡</button>
          <span class="like-count">0</span>
          <span class="comment-count">0 comments</span>
        </div>
        <div class="comments"></div>
        <form class="comment-form">
          <input class="comment-input" maxlength="280" placeholder="drop a comment" />
          <button type="submit">send</button>
        </form>
      </article>
    </template>

    <template id="commentTemplate">
      <div class="comment">
        <p class="comment-message"></p>
        <div class="comment-tools">
          <time class="comment-date"></time>
          <button class="edit-comment" type="button">edit</button>
          <button class="delete-comment" type="button">del</button>
        </div>
      </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./app.js"></script>
  </body>
</html>
